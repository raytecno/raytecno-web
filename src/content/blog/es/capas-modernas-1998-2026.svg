<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Capas modernas 2026 sobre la arquitectura CIM de 1998</title>
<desc>Seis capas tecnológicas que se han añadido al esquema CIM original: trazabilidad por pieza, omnicanalidad, integración con cliente final, IoT en taller, analítica predictiva y cumplimiento normativo digital.</desc>
<defs>
<style>
  .t { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .ts { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .th { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="40" style="font-size:18px; font-weight:500">De 1998 a 2026: la arquitectura aguanta, las capas crecen</text>
<text class="ts" x="40" y="60">Seis capas modernas se añaden sobre el mismo núcleo CIM diseñado hace 28 años</text>

<rect x="40" y="100" width="600" height="80" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="60" y="128" fill="#2C2C2A">Núcleo CIM original (1998)</text>
<text class="ts" x="60" y="148" fill="#444441">Administración · planificación · CAD · CAP · CAQ · PPC · ventas · compras · CAM</text>
<text class="ts" x="60" y="166" fill="#444441">La arquitectura conceptual sigue vigente · sólo cambian las capacidades</text>

<rect x="40" y="210" width="190" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="56" y="234" fill="#26215C">Trazabilidad pieza/lote</text>
<text class="ts" x="56" y="254" fill="#3C3489">Cada pieza tiene historia</text>
<text class="ts" x="56" y="272" fill="#3C3489">completa desde lingote</text>
<text class="ts" x="56" y="290" fill="#3C3489">a vitrina</text>

<rect x="246" y="210" width="190" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="262" y="234" fill="#26215C">Omnicanalidad</text>
<text class="ts" x="262" y="254" fill="#3C3489">Tienda, web, B2B, córner</text>
<text class="ts" x="262" y="272" fill="#3C3489">marketplace, todo bajo</text>
<text class="ts" x="262" y="290" fill="#3C3489">un único stock</text>

<rect x="450" y="210" width="190" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="466" y="234" fill="#26215C">Integración cliente final</text>
<text class="ts" x="466" y="254" fill="#3C3489">Configuradores 3D,</text>
<text class="ts" x="466" y="272" fill="#3C3489">prueba virtual,</text>
<text class="ts" x="466" y="290" fill="#3C3489">anillos a medida online</text>

<rect x="40" y="316" width="190" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="56" y="340" fill="#04342C">IoT en taller</text>
<text class="ts" x="56" y="360" fill="#085041">Datos en tiempo real de</text>
<text class="ts" x="56" y="378" fill="#085041">hornos, prensas, baños,</text>
<text class="ts" x="56" y="396" fill="#085041">básculas de precisión</text>

<rect x="246" y="316" width="190" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="262" y="340" fill="#04342C">Analítica predictiva</text>
<text class="ts" x="262" y="360" fill="#085041">Dónde aparecerá el</text>
<text class="ts" x="262" y="378" fill="#085041">cuello de botella mañana,</text>
<text class="ts" x="262" y="396" fill="#085041">qué referencia romperá stock</text>

<rect x="450" y="316" width="190" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="466" y="340" fill="#04342C">Cumplimiento digital</text>
<text class="ts" x="466" y="360" fill="#085041">LBMA para oro,</text>
<text class="ts" x="466" y="378" fill="#085041">Kimberley para diamantes,</text>
<text class="ts" x="466" y="396" fill="#085041">RJC, declaraciones IVA</text>

<line x1="135" y1="200" x2="135" y2="208" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="200" x2="340" y2="208" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="545" y1="200" x2="545" y2="208" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="135" y1="306" x2="135" y2="314" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="306" x2="340" y2="314" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="545" y1="306" x2="545" y2="314" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="450" fill="#2C2C2A" style="font-weight:500">Lo que sí cambia con cada capa nueva</text>
<text class="ts" x="40" y="472" fill="#5F5E5A">Más datos, más velocidad, más precisión, más automatización.</text>
<text class="ts" x="40" y="490" fill="#5F5E5A">Pero el esquema sigue siendo administración → núcleo → fabricación → cliente.</text>
<text class="ts" x="40" y="508" fill="#5F5E5A">Cualquier ERP joyero moderno —RayTecno incluido— construye sobre estos cimientos.</text>

<g transform="translate(40, 540)">
<rect x="0" y="0" width="14" height="14" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="20" y="11" fill="#5F5E5A">Núcleo 1998</text>

<rect x="130" y="0" width="14" height="14" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="150" y="11" fill="#5F5E5A">Capas de información (2005-2015)</text>

<rect x="370" y="0" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="390" y="11" fill="#5F5E5A">Capas de inteligencia (2015-2026)</text>
</g>
</svg>
