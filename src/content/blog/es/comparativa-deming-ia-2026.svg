<text class="ts" x="280" y="85" fill="#04342C" text-anchor="middle" style="font-weight:500">Plena</text>
<text class="ts" x="330" y="85" fill="#5F5E5A">Inspección 100%</text>
<text class="ts" x="490" y="85" fill="#5F5E5A">Definir qué es calidad</text>

