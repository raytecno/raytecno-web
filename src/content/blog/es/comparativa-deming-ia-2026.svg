<text class="ts" x="14" y="18" fill="#04342C" style="font-weight:500">1. Constancia en la mejora</text>
<text class="ts" x="14" y="36" fill="#085041">Propósito a largo plazo</text>
<rect x="240" y="0" width="80" height="48" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="280" y="29" fill="#04342C" text-anchor="middle" style="font-weight:500">Plena</text>
<text class="ts" x="330" y="29" fill="#5F5E5A">Datos longitudinales</text>
<text class="ts" x="490" y="29" fill="#5F5E5A">Decisión estratégica</text>

<rect x="0" y="56" width="230" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="14" y="74" fill="#04342C" style="font-weight:500">2. Nueva filosofía</text>
<text class="ts" x="14" y="92" fill="#085041">No tolerar errores</text>
