<svg width="100%" viewBox="0 0 680 880" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Los 14 puntos de Deming en 2026: vigencia y aporte de la IA</title>
<desc>Tabla comparativa de los 14 principios de calidad de W. Edwards Deming evaluados en 2026: cuáles siguen vigentes, cuáles se han reformulado, qué aporta la IA en cada uno y qué sigue siendo competencia humana.</desc>
<defs>
<style>
  .t { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .ts { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .th { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
</style>
</defs>

<text class="th" x="40" y="40" style="font-size:18px; font-weight:500">Los 14 puntos de Deming en 2026</text>
<text class="ts" x="40" y="60">Vigencia, aporte de la IA y lo que sigue siendo humano</text>

<rect x="40" y="90" width="600" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
