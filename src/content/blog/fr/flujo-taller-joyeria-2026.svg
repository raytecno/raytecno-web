<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flujo de fabricación de joyería — taller completo</title>
<desc>Diagrama radial del proceso productivo joyero: oro como entrada central, tres centros de coste, las secciones del taller en anillo medio y las fases concretas en anillo externo. Almacenes intermedios marcados radialmente.</desc>
<defs>
<style>
  .t { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .ts { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .th { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
</style>
</defs>

<text class="th" x="40" y="40" style="font-size:18px; font-weight:500">Flujo de fabricación de joyería</text>
<text class="ts" x="40" y="60">Centros de coste · secciones · fases · almacenes intermedios</text>

<g transform="translate(340, 380)">
<circle cx="0" cy="0" r="240" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<circle cx="0" cy="0" r="170" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<circle cx="0" cy="0" r="90" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<circle cx="0" cy="0" r="40" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>

<text class="th" x="0" y="-2" text-anchor="middle" fill="#412402" style="font-weight:500">Oro</text>
<text class="ts" x="0" y="14" text-anchor="middle" fill="#633806">materia prima</text>

<text class="ts" x="-55" y="-50" text-anchor="middle" fill="#04342C" style="font-weight:500">CC1</text>
<text class="ts" x="60" y="60" text-anchor="middle" fill="#04342C" style="font-weight:500">CC2</text>
<text class="ts" x="-50" y="60" text-anchor="middle" fill="#04342C" style="font-weight:500">CC3</text>

<line x1="-90" y1="0" x2="90" y2="0" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="0" y1="-90" x2="0" y2="90" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>

<text class="ts" x="65" y="-105" text-anchor="middle" fill="#085041">Cauchos</text>
<text class="ts" x="115" y="-50" text-anchor="middle" fill="#085041">Ceras</text>
<text class="ts" x="125" y="20" text-anchor="middle" fill="#085041">Yesos</text>
<text class="ts" x="100" y="80" text-anchor="middle" fill="#085041">Microfusión</text>
<text class="ts" x="40" y="125" text-anchor="middle" fill="#085041">Esmerilado</text>
<text class="ts" x="-40" y="125" text-anchor="middle" fill="#085041">Montaje</text>
<text class="ts" x="-100" y="80" text-anchor="middle" fill="#085041">Pulido</text>
<text class="ts" x="-125" y="20" text-anchor="middle" fill="#085041">Engaste</text>
<text class="ts" x="-115" y="-50" text-anchor="middle" fill="#085041">Acabados</text>
<text class="ts" x="-65" y="-105" text-anchor="middle" fill="#085041">Expedición</text>

<text class="ts" x="65" y="-200" text-anchor="middle" fill="#26215C">Preparar</text>
<text class="ts" x="65" y="-184" text-anchor="middle" fill="#26215C">vulcanizar</text>
<text class="ts" x="65" y="-168" text-anchor="middle" fill="#26215C">cortar</text>

<text class="ts" x="170" y="-130" text-anchor="middle" fill="#26215C">Inyección ceras</text>
<text class="ts" x="170" y="-114" text-anchor="middle" fill="#26215C">engaste cera</text>
<text class="ts" x="170" y="-98" text-anchor="middle" fill="#26215C">montaje árbol</text>

<text class="ts" x="195" y="-30" text-anchor="middle" fill="#26215C">Colocar yeso</text>
<text class="ts" x="195" y="-14" text-anchor="middle" fill="#26215C">descerar</text>

<text class="ts" x="170" y="50" text-anchor="middle" fill="#26215C">Colocar horno</text>
<text class="ts" x="170" y="66" text-anchor="middle" fill="#26215C">fundición</text>

<text class="ts" x="100" y="160" text-anchor="middle" fill="#26215C">Esmeril mano</text>
<text class="ts" x="100" y="176" text-anchor="middle" fill="#26215C">turbo esmeril</text>

<text class="ts" x="-100" y="160" text-anchor="middle" fill="#26215C">Soldadura</text>
<text class="ts" x="-100" y="176" text-anchor="middle" fill="#26215C">montaje</text>

<text class="ts" x="-180" y="50" text-anchor="middle" fill="#26215C">Magnética</text>
<text class="ts" x="-180" y="66" text-anchor="middle" fill="#26215C">turbo pulido</text>

<text class="ts" x="-195" y="-30" text-anchor="middle" fill="#26215C">Engaste</text>
<text class="ts" x="-195" y="-14" text-anchor="middle" fill="#26215C">brillo a mano</text>

<text class="ts" x="-170" y="-130" text-anchor="middle" fill="#26215C">Chorro arena</text>
<text class="ts" x="-170" y="-114" text-anchor="middle" fill="#26215C">cepillado</text>
<text class="ts" x="-170" y="-98" text-anchor="middle" fill="#26215C">baño rodio</text>

<text class="ts" x="-65" y="-200" text-anchor="middle" fill="#26215C">Expedición</text>
<text class="ts" x="-65" y="-184" text-anchor="middle" fill="#26215C">colocar perla</text>
</g>

<g transform="translate(340, 380)">
<line x1="100" y1="-180" x2="200" y2="-260" class="leader"/>
<text class="ts" x="206" y="-256" fill="#185FA5" style="font-weight:500">Almacén pilotos</text>

<line x1="180" y1="-100" x2="240" y2="-200" class="leader"/>
<text class="ts" x="246" y="-196" fill="#185FA5" style="font-weight:500">Almacén ceras</text>

<line x1="220" y1="0" x2="290" y2="-30" class="leader"/>
<text class="ts" x="296" y="-26" fill="#185FA5" style="font-weight:500">Almacén piedras</text>

<line x1="200" y1="80" x2="290" y2="110" class="leader"/>
<text class="ts" x="296" y="114" fill="#185FA5" style="font-weight:500">Almacén MP</text>

<line x1="100" y1="200" x2="180" y2="270" class="leader"/>
<text class="ts" x="186" y="274" fill="#185FA5" style="font-weight:500">Almacén complementos</text>

<line x1="-150" y1="200" x2="-230" y2="270" class="leader"/>
<text class="ts" x="-236" y="274" text-anchor="end" fill="#185FA5" style="font-weight:500">Almacén semi</text>

<line x1="-220" y1="0" x2="-290" y2="-30" class="leader"/>
<text class="ts" x="-296" y="-26" text-anchor="end" fill="#185FA5" style="font-weight:500">Almacén acabados</text>

<line x1="-100" y1="-180" x2="-200" y2="-260" class="leader"/>
<text class="ts" x="-206" y="-256" text-anchor="end" fill="#185FA5" style="font-weight:500">Almacén cauchos</text>
</g>

<g transform="translate(40, 670)">
<rect x="0" y="0" width="14" height="14" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="20" y="11" fill="#5F5E5A">Materia prima</text>

<rect x="120" y="0" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="140" y="11" fill="#5F5E5A">Secciones</text>

<rect x="220" y="0" width="14" height="14" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="240" y="11" fill="#5F5E5A">Fases productivas</text>

<rect x="380" y="0" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="400" y="11" fill="#5F5E5A">Almacenes intermedios</text>
</g>
</svg>
