<rect x="406" y="436" width="100" height="80" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="456" y="458" text-anchor="middle" fill="#412402">Acabados</text>
<text class="ts" x="456" y="478" text-anchor="middle" fill="#633806">Baño rodio,</text>
<text class="ts" x="456" y="494" text-anchor="middle" fill="#633806">grabado</text>

<rect x="516" y="436" width="100" height="80" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="566" y="458" text-anchor="middle" fill="#412402">Expedición</text>
