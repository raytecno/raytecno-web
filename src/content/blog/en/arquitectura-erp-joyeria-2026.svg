<text class="ts" x="566" y="494" text-anchor="middle" fill="#633806">cliente final</text>

<text class="ts" x="40" y="565" fill="#5F5E5A" style="font-weight:500">Capas modernas integradas</text>

<rect x="40" y="580" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="56" y="602" fill="#042C53">Trazabilidad lote/pieza</text>
<text class="ts" x="56" y="620" fill="#0C447C">LBMA, Kimberley, RJC</text>

<rect x="246" y="580" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="262" y="602" fill="#042C53">Omnicanal</text>
<text class="ts" x="262" y="620" fill="#0C447C">Tienda, web, B2B, córner</text>

<rect x="450" y="580" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
