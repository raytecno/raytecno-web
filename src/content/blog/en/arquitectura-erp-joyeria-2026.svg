<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arquitectura ERP integrado para joyería — RayTecno</title>
<desc>Esquema de capas: administración, planificación, diseño, calidad, control de producción, ventas, compras, fabricación y flujo de materiales del taller joyero, desde proveedor a cliente.</desc>
<defs>
<style>
  .t { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .ts { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .th { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="40" style="font-size:18px; font-weight:500">Arquitectura ERP integrado para joyería</text>
<text class="ts" x="40" y="60">Cuatro objetivos: cero stock excedente, cero retrasos, cero papeles, trazabilidad total</text>

