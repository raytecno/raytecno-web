<line x1="100" y1="664" x2="600" y2="664" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="612" y="668" text-anchor="end" fill="#5F5E5A">Cliente final</text>
<text class="ts" x="340" y="688" text-anchor="middle" fill="#888780" style="font-style:italic">Flujo de materiales y de información</text>
